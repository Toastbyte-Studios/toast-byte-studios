<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon and site icon tags per Google guidelines -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- Matched to the actual page background in each theme so the mobile
         browser chrome blends with the page instead of banding against it. -->
    <meta
      name="theme-color"
      content="#f3f2f2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#17161a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Toastbyte Studios is an independent development studio in Las Vegas building GitAll, TOAST and Alley Admin — software that works offline, loads fast, and is maintained after launch."
    />

    <!-- Canonical. This is the home-page value and the starting point only:
         every path is served this same document, so App.tsx rewrites this
         href (and og:url) to match the active route once rendered. -->
    <link rel="canonical" href="https://toastbyte.studio/" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toastbyte.studio/" />
    <meta
      property="og:title"
      content="Toastbyte Studios — independent software development"
    />
    <meta
      property="og:description"
      content="An independent development studio in Las Vegas with a portfolio of its own products: GitAll, TOAST and Alley Admin."
    />
    <!-- Primary: webp supported by all modern crawlers (Facebook, Twitter/X, Discord, Slack, iMessage) -->
    <meta
      property="og:image"
      content="https://toastbyte.studio/assets/images/ToastByteStudios.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TOAST — Trusted Outdoor and Survival Toolkit app logo by Toastbyte Studios"
    />
    <!-- Fallback: PNG for older crawlers that don't support webp -->
    <meta
      property="og:image"
      content="https://toastbyte.studio/assets/images/Logo.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TOAST — Trusted Outdoor and Survival Toolkit app logo by Toastbyte Studios"
    />
    <meta property="og:site_name" content="Toastbyte Studios" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Toastbyte Studios — independent software development"
    />
    <meta
      name="twitter:description"
      content="An independent development studio in Las Vegas with a portfolio of its own products."
    />
    <meta
      name="twitter:image"
      content="https://toastbyte.studio/assets/images/ToastByteStudios.webp"
    />

    <meta name="msapplication-TileColor" content="#0f0f10" />

    <!-- Additional SEO signals -->
    <meta
      name="keywords"
      content="emergency preparedness app, survival toolkit, offline maps, ham radio, prepper app, hiking app, TOAST app"
    />
    <meta name="author" content="Jason Shprintz, Toastbyte Studios" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "TOAST",
            "alternateName": "Trusted Outdoor and Survival Toolkit",
            "description": "An offline-first emergency preparedness app with navigation, communications, and survival reference tools for hikers and preppers.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": ["iOS", "Android"],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free with optional one-time Pro unlock"
            },
            "author": {
              "@type": "Person",
              "name": "Jason Shprintz",
              "url": "https://github.com/jason-shprintz"
            },
            "publisher": {
              "@type": "Organization",
              "name": "Toastbyte Studios",
              "url": "https://toastbyte.studio/",
              "logo": "https://toastbyte.studio/assets/images/Logo.png"
            }
          },
          {
            "@type": "Organization",
            "name": "Toastbyte Studios",
            "url": "https://toastbyte.studio/",
            "logo": "https://toastbyte.studio/assets/images/Logo.png",
            "description": "A small app studio based in Las Vegas building practical tools for outdoor and preparedness communities.",
            "founder": {
              "@type": "Person",
              "name": "Jason Shprintz"
            },
            "sameAs": ["https://github.com/jason-shprintz"]
          }
        ]
      }
    </script>
    <!-- Preload the two faces tokens.css actually declares. The latin-ext
         subsets are left to load on demand — almost no page here needs
         them, and preloading a font nothing renders is wasted bandwidth. -->
    <link
      rel="preload"
      href="/assets/fonts/CormorantGaramond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/Lora-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Toastbyte Studios — independent software development</title>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
    ></script>
    <!-- Applies the saved or preferred theme before first paint. The body is
         prerendered now, so without this a dark-mode visitor would see a full
         page of light-themed content flash before ThemeProvider's effect runs. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tb-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('tb-dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* localStorage blocked — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
